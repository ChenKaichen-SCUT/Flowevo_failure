[project]
name = "flowevo-scienceworld"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["scienceworld==1.3.0", "httpx", "aiohttp", "PyYAML", "psutil", "numpy", "scipy", "pandas", "zstandard"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
